<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Management App</title>
    <script>
      /* GitHub Pages: redirect unknown paths to app root (HashRouter handles routes) */
      var base = '/auca-summer-app/';
      var path = window.location.pathname;
      if (!path.endsWith('/') && path.indexOf('.') === -1) {
        window.location.replace(base);
      }
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
